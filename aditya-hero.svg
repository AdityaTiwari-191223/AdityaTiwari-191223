<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="ah-title ah-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ah-title">Aditya Tiwari</title>
  <desc id="ah-desc">AI x Finance. Building intelligent portfolio systems.</desc>
  <defs>
    <linearGradient id="ah-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
      <animate attributeName="x2" values="1;0.8;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ah-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
    <radialGradient id="ah-glow" cx="0.82" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ah-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#ah-bg)"/>
  <rect width="1200" height="320" fill="url(#ah-grid)"/>
  <rect width="1200" height="320" fill="url(#ah-glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- restrained orbital geometry -->
  <g fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="1">
    <circle cx="985" cy="150" r="95"/>
    <circle cx="985" cy="150" r="140" stroke-opacity="0.18"/>
    <ellipse cx="985" cy="150" rx="140" ry="55" stroke-opacity="0.22" transform="rotate(-22 985 150)"/>
  </g>
  <circle r="5" fill="#E5B5C7">
    <animateMotion dur="14s" repeatCount="indefinite" path="M985,55 A95,95 0 1,1 984.9,55 Z"/>
  </circle>
  <circle r="3" fill="#C77B9B">
    <animateMotion dur="22s" repeatCount="indefinite" path="M985,10 A140,140 0 1,0 984.9,10 Z"/>
  </circle>

  <!-- animated growth path (static line remains visible without motion) -->
  <path d="M620 255 L700 232 L770 244 L850 196 L920 208 L1000 150 L1090 110 L1160 78"
        fill="none" stroke="#C77B9B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="900" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="900;0;0;900" keyTimes="0;0.45;0.85;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <circle cx="1160" cy="78" r="5" fill="#F8F0F3">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- text -->
  <text x="70" y="70" font-family="'Courier New', monospace" font-size="15" letter-spacing="4" fill="#C77B9B">AI × FINANCE</text>
  <text x="70" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#F8F0F3">Aditya Tiwari</text>
  <text x="70" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#E5B5C7">Building intelligent portfolio systems</text>
  <text x="70" y="240" font-family="'Courier New', monospace" font-size="14" letter-spacing="2" fill="#C77B9B" fill-opacity="0.9">ML  ·  QUANT FINANCE  ·  PRODUCT</text>

  <!-- glowing underline -->
  <rect x="70" y="164" width="360" height="3" rx="1.5" fill="url(#ah-line)">
    <animate attributeName="width" values="120;360;360;120" keyTimes="0;0.4;0.85;1" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
